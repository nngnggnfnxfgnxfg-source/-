<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Генератор случайного числа</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #f5f7ff, #e0ecff);
        color: #1b1f3b;
      }

      .card {
        background: white;
        padding: 2.5rem 3rem;
        border-radius: 1.5rem;
        box-shadow: 0 20px 50px rgba(20, 27, 78, 0.15);
        text-align: center;
        max-width: 420px;
        width: min(90vw, 420px);
      }

      h1 {
        font-size: 1.8rem;
        margin-bottom: 0.5rem;
      }

      p {
        margin-top: 0;
        margin-bottom: 2rem;
        color: #4c5070;
      }

      .number {
        font-size: 3.5rem;
        font-weight: 700;
        margin-bottom: 1.5rem;
        color: #304ffe;
      }

      button {
        border: none;
        background: #304ffe;
        color: white;
        padding: 0.85rem 2rem;
        font-size: 1rem;
        border-radius: 999px;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(48, 79, 254, 0.3);
      }

      button:active {
        transform: translateY(0);
        box-shadow: none;
      }

      .range {
        display: inline-flex;
        gap: 0.5rem;
        align-items: center;
        margin-bottom: 1.5rem;
      }

      input[type="number"] {
        width: 5rem;
        padding: 0.4rem 0.6rem;
        border-radius: 0.6rem;
        border: 1px solid #c6c9e3;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Случайное число</h1>
      <p>Задайте диапазон и нажмите кнопку, чтобы получить новое число.</p>
      <div class="range">
        <label for="min">от</label>
        <input id="min" type="number" value="1" />
        <label for="max">до</label>
        <input id="max" type="number" value="100" />
      </div>
      <div class="number" id="number">—</div>
      <button id="generate">Сгенерировать</button>
    </main>

    <script>
      const minInput = document.getElementById("min");
      const maxInput = document.getElementById("max");
      const numberEl = document.getElementById("number");
      const button = document.getElementById("generate");

      const generateNumber = () => {
        const min = Number(minInput.value);
        const max = Number(maxInput.value);

        if (Number.isNaN(min) || Number.isNaN(max) || min > max) {
          numberEl.textContent = "Ошибка";
          return;
        }

        const value = Math.floor(Math.random() * (max - min + 1)) + min;
        numberEl.textContent = value;
      };

      button.addEventListener("click", generateNumber);
      generateNumber();
    </script>
  </body>
</html>
